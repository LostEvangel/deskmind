[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "deskmind"
version = "0.1.0"
description = "AI-powered desktop files organization agent"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [
    { name = "DeskMind", email = "deskmind@users.noreply.github.com" },
]
keywords = ["desktop", "organizer", "ai", "mcp", "claude", "files"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Win32 (MS Windows)",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Desktop Environment :: File Managers",
    "Topic :: Utilities",
]
dependencies = [
    "anthropic>=0.49.0",
    "mcp>=1.0.0",
    "watchdog>=4.0.0",
    "send2trash>=1.8.0",
    "click>=8.1.0",
    "pydantic>=2.0.0",
    "pyyaml>=6.0",
    "openai>=1.0.0",
    "rich>=13.0.0",
    "pywin32>=310",
]

[project.urls]
homepage = "https://github.com/LostEvangel/deskmind"
repository = "https://github.com/LostEvangel/deskmind"
documentation = "https://github.com/LostEvangel/deskmind#readme"

[project.scripts]
deskmind = "deskmind.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24.0",
    "build>=1.0",
    "twine>=5.0",
]
pyinstaller = [
    "pyinstaller>=6.0",
]

[tool.hatch.build.targets.wheel]
packages = ["deskmind"]
